<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --blue:#1d4ed8; --ink:#0f172a; --mut:#64748b; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:340px; font:13px/1.45 "Segoe UI",system-ui,sans-serif; color:var(--ink); }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px;
           background:linear-gradient(135deg,#1e3a8a,#1d4ed8); color:#fff; }
  header .logo { width:22px; height:22px; border-radius:5px; background:#fff;
                 display:flex; align-items:center; justify-content:center;
                 font-weight:800; color:var(--blue); font-size:13px; }
  header h1 { font-size:14px; font-weight:600; flex:1; }
  header .ver { font-size:10px; opacity:.8; }
  .status { display:flex; align-items:center; gap:6px; padding:8px 14px;
            background:#f1f5f9; border-bottom:1px solid #e2e8f0; font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .status .sp { flex:1; }
  .status a { color:var(--blue); text-decoration:none; font-weight:600; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 14px 4px; }
  button { border:1px solid #dbe2ee; background:#fff; border-radius:8px;
           padding:9px 8px; font:600 12px "Segoe UI",system-ui,sans-serif;
           color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--blue); color:var(--blue); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.primary:hover { background:#1e40af; }
  button:disabled { opacity:.5; cursor:default; }
  .queuebar { display:flex; align-items:center; gap:8px; padding:8px 14px;
              color:var(--mut); font-size:11px; }
  .queuebar b { color:var(--ink); }
  .queuebar button { padding:4px 10px; font-size:11px; }
  h2 { font:700 10px "Segoe UI",system-ui,sans-serif; letter-spacing:.08em;
       text-transform:uppercase; color:var(--mut); padding:8px 14px 4px; }
  #jobs { padding:0 14px 12px; }
  .job { display:flex; gap:8px; align-items:baseline; padding:6px 8px;
         border:1px solid #eef2f7; border-radius:7px; margin-bottom:5px; }
  .job .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            font-weight:600; font-size:12px; }
  .job .m { color:var(--mut); font-size:10px; white-space:nowrap; }
  .st { font-size:10px; font-weight:700; padding:1px 7px; border-radius:9px; }
  /* v2.2.1: every status has its OWN color - "queued" is gray (waiting),
     only "printed" is green. Before, queued was green too and stuck
     queues looked healthy. */
  .st.printed { background:#dcfce7; color:#166534; }
  .st.queued { background:#e2e8f0; color:#475569; }
  .st.printing { background:#dbeafe; color:#1e40af; }
  .st.held { background:#ffedd5; color:#9a3412; }
  .st.scheduled { background:#ede9fe; color:#5b21b6; }
  .st.forwarded { background:#dbeafe; color:#1e40af; }
  .st.saved { background:#fef9c3; color:#854d0e; }
  .st.failed, .st.dead, .st.canceled { background:#fee2e2; color:#991b1b; }
  .job { flex-wrap:wrap; }
  .job .e { flex-basis:100%; color:#b91c1c; font-size:10px; line-height:1.3;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pbtn { flex:none; border:1px solid #dbe2ee; background:#fff; border-radius:6px;
          padding:1px 7px; font:700 10px "Segoe UI",system-ui,sans-serif;
          color:var(--ink); cursor:pointer; }
  .pbtn:hover { border-color:var(--blue); color:var(--blue); }
  .pbtn:disabled { opacity:.4; cursor:default; }
  #qstate.paused { color:var(--bad); }
  .empty { color:var(--mut); font-size:12px; padding:10px; text-align:center; }
  footer { padding:8px 14px; border-top:1px solid #eef2f7; display:flex;
           justify-content:space-between; font-size:11px; color:var(--mut); }
  footer a { color:var(--blue); text-decoration:none; font-weight:600; }
  #msg { margin:0 14px 8px; font-size:11px; border-radius:6px; padding:6px 9px; display:none; }
  #msg.err { display:block; background:#fee2e2; color:#991b1b; }
  #msg.info { display:block; background:#dbeafe; color:#1e40af; }
  .switches { padding:8px 14px 2px; display:flex; flex-direction:column; gap:6px; }
  .banner { display:none; align-items:center; gap:8px; margin:8px 14px 0;
            padding:8px 10px; border-radius:8px; font-size:11.5px; line-height:1.35; }
  .banner.show { display:flex; }
  .banner.offline { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
  .banner.warn { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .banner button { padding:4px 9px; font-size:11px; flex:none; }
  .banner .btxt { flex:1; }
  .sw { display:flex; align-items:center; gap:10px; padding:7px 9px;
        border:1px solid #eef2f7; border-radius:8px; cursor:pointer;
        user-select:none; }
  .sw .swtext { flex:1; line-height:1.25; }
  .sw b { font-size:12px; display:block; }
  .sw small { color:var(--mut); font-size:10px; }
  .sw input { display:none; }
  .sw .slider { width:34px; height:19px; border-radius:10px; background:#cbd5e1;
                position:relative; transition:background .15s; flex:none; }
  .sw .slider::after { content:""; position:absolute; top:2px; left:2px;
                       width:15px; height:15px; border-radius:50%; background:#fff;
                       transition:left .15s; box-shadow:0 1px 2px rgb(0 0 0 / .25); }
  .sw input:checked + .slider { background:var(--ok); }
  .sw input:checked + .slider::after { left:17px; }
  .sw.off .slider { background:#94a3b8; }
  body.off .actions button.primary { background:#94a3b8; border-color:#94a3b8; }
</style>
</head>
<body>
  <header>
    <div class="logo">A</div>
    <h1>AdvPrint Pro</h1>
    <span class="ver" id="ver">v2.6.4</span>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span><span id="stat">Checking hub...</span>
    <span class="sp"></span><a href="#" id="connect">Connect</a>
  </div>

  <div class="banner offline" id="offlineBanner">
    <span class="btxt" id="offlineText">Hub offline</span>
    <button id="bRetry">Retry now</button>
  </div>
  <div class="banner warn" id="tokenBanner">
    <span class="btxt" id="tokenText">Using the DEFAULT token</span>
    <button id="bFixToken" title="v2.6: ask the running hub (this PC) for its current token and store it - no typing, no Options visit">Fix token</button>
    <button id="bTokenHelp">Change</button>
  </div>
  <div class="banner warn" id="heldBanner">
    <span class="btxt" id="heldText"></span>
    <button id="bPrintHeld" title="Send every waiting job to the printer right now (bypasses the printer-status check)">Print now</button>
  </div>

  <div class="switches">
    <label class="sw" id="swEnabledRow" title="Master switch: turns ALL AdvPrint printing, auto-print, the print() hook and the page API on or off">
      <span class="swtext"><b>AdvPrint enabled</b><small id="swEnabledSub">printing is on</small></span>
      <input type="checkbox" id="swEnabled">
      <span class="slider"></span>
    </label>
    <label class="sw" id="swQueueRow" title="ON: jobs wait in the hub queue in order (pause works). OFF: instant print - every job goes straight to the printer; if no printer is active the job is auto-queued and prints when it is back">
      <span class="swtext"><b>Queue mode</b><small id="swQueueSub">jobs wait in order + pause works</small></span>
      <input type="checkbox" id="swQueue">
      <span class="slider"></span>
    </label>
  </div>

  <div id="msg"></div>

  <div class="actions">
    <button class="primary" id="bPage">Print this page</button>
    <button id="bFile" title="Save the page as a PDF file - no paper, no dialog">Save as PDF</button>
    <button id="bShot">Print screenshot</button>
    <button id="bTest">Test page</button>
    <button id="bOpts">Options</button>
  </div>

  <div class="queuebar">
    Queue: <b id="qstate">-</b> <span id="qpend"></span>
    <span class="sp" style="flex:1"></span>
    <button id="bPause">Pause</button>
  </div>

  <h2 data-i18n="popRecentJobs">Recent jobs</h2>
  <div id="jobs"><div class="empty">No jobs yet.</div></div>

  <footer>
    <span>100% local &middot; no cloud</span>
    <a href="#" id="lnkDebug" title="Open the Debug tab - see WHY nothing prints">Debug</a>
    <a href="#" id="lnkApi">window.advprint API</a>
  </footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
